name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:${{ matrix.suite }}

  offline-quality-gates:
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality suite
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = "success"

  deploy-fly-experience:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_FLY_DEPLOY == 'true'
    needs: offline-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.FLY_DEPLOY_URL }}
    env:
      ENABLE_FLY_DEPLOY: ${{ vars.ENABLE_FLY_DEPLOY }}
      FLY_APP: ${{ vars.FLY_APP }}
      FLY_DEPLOY_URL: ${{ vars.FLY_DEPLOY_URL }}
      NEXT_PUBLIC_NOODLE_ASSISTANT_EMBED_ID: ${{ vars.NEXT_PUBLIC_NOODLE_ASSISTANT_EMBED_ID }}
      NEXT_PUBLIC_NOODLE_SERVICE_URL: ${{ vars.NEXT_PUBLIC_NOODLE_SERVICE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.97
      - name: Verify deployment coordinates
        run: |
          node scripts/validate-fly-deployment.mjs
      - name: Deploy Fly Experience
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          test -n "$FLY_API_TOKEN"
          flyctl deploy --remote-only \
            --app "$FLY_APP" \
            --build-arg NEXT_PUBLIC_SITE_URL="$FLY_DEPLOY_URL" \
            --build-arg NEXT_PUBLIC_NOODLE_ASSISTANT_EMBED_ID="$NEXT_PUBLIC_NOODLE_ASSISTANT_EMBED_ID" \
            --build-arg NEXT_PUBLIC_NOODLE_SERVICE_URL="$NEXT_PUBLIC_NOODLE_SERVICE_URL" \
            --wait-timeout 5m
      - name: Verify Fly deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$FLY_APP"
          response_file=$(mktemp)
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "$response_file" \
            "$FLY_DEPLOY_URL"
          if grep --fixed-strings --quiet \
            "Add NEXT_PUBLIC_NOODLE_ASSISTANT_EMBED_ID to start the travel assistant." \
            "$response_file"; then
            echo "::error::Fly rendered the assistant setup-required state."
            exit 1
          fi
