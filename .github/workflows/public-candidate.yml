name: Public starter candidate

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install without developer credentials
        run: pnpm install --frozen-lockfile
      - name: Audit public contents, history, guidance, licenses and advisories
        run: pnpm audit:release
      - name: Install browser for fictional UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check widget and website browser behavior
        run: pnpm check:browser
