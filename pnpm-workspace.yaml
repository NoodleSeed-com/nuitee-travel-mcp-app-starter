packages:
  - 'apps/*'
  - 'examples/*'

allowBuilds:
  sharp: true

# Keep advisory fixes bounded to vulnerable transitive versions.
overrides:
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'qs@>=2.2.5 <6.16.0': '6.16.0'
  '@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33': '4.0.33'
  'hono@>=4.0.0 <4.13.7': '4.13.7'
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  'ip-address@<=10.7.0': '10.7.1'
  'dompurify@<=3.4.15': '3.4.16'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'proxy-addr@>=1.1.0 <2.0.8': '2.0.8'
  'sharp@<0.35.5': '0.35.5'
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': '1.31.0'

# Hold newly published dependencies for 24 hours by default. These two exact
# Noodle versions were reviewed as one compatibility set during the controlled
# upgrade; future Noodle updates must update the pins, lockfile, Agent Kit, and
# this exception deliberately.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@noodleseed/one@0.161.2'
  - '@noodleseed/assistant@1.27.0'
